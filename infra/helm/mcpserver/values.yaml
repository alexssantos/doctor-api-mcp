replicaCount: 1

image:
  repository: mcpserver
  tag: latest
  pullPolicy: Never

service:
  type: ClusterIP
  port: 4000
  targetPort: 4000

serviceAccount:
  name: mcp-reader

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

jaeger:
  baseUrl: http://jaeger:16686

kubernetes:
  namespace: mcp-apis

services:
  precoapi: http://precoapi
  produtoapi: http://produtoapi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 15
