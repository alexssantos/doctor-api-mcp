{{- include "doctor-api-mcp.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "doctor-api-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doctor-api-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "doctor-api-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "doctor-api-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "doctor-api-mcp.serviceAccountName" . }}
      {{- if ne .Values.serviceAccount.automountToken nil }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- else }}
      automountServiceAccountToken: {{ ne (lower (toString .Values.clusterAccess.scope)) "none" }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: doctor-api-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "doctor-api-mcp.fullname" . }}-config
            {{- if .Values.security.authentication.enabled }}
            - secretRef:
                name: {{ include "doctor-api-mcp.authSecretName" . }}
            {{- end }}
          {{- if or .Values.clusterAccess.allowVolumes .Values.extraEnv }}
          env:
            {{- if .Values.clusterAccess.allowVolumes }}
            - name: TMPDIR
              value: /tmp
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /live
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          startupProbe:
            httpGet:
              path: /live
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          {{- if .Values.clusterAccess.allowVolumes }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.clusterAccess.allowVolumes }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
