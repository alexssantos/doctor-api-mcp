{{- if and .Values.security.authentication.enabled (not .Values.security.authentication.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doctor-api-mcp.authSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doctor-api-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  Security__Authentication__ReaderApiKey: {{ required "security.authentication.readerKey is required when authentication is enabled without existingSecret" .Values.security.authentication.readerKey | quote }}
  Security__Authentication__AdminApiKey: {{ required "security.authentication.adminKey is required when authentication is enabled without existingSecret" .Values.security.authentication.adminKey | quote }}
{{- end }}
