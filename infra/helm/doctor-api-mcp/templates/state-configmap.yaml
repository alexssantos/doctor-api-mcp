{{- if eq (lower (toString .Values.clusterAccess.stateStorage)) "configmap" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "doctor-api-mcp.fullname" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doctor-api-mcp.labels" . | nindent 4 }}
data:
  indexing-overrides: "{}"
{{- end }}
