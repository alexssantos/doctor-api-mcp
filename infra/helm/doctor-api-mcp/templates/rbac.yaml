{{- $scope := lower (toString .Values.clusterAccess.scope) -}}
{{- $configMapState := eq (lower (toString .Values.clusterAccess.stateStorage)) "configmap" -}}
{{- if eq $scope "cluster" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "doctor-api-mcp.fullname" . }}
  labels:
    {{- include "doctor-api-mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      {{- if .Values.observability.enableDeploymentEvents }}
      - events
      {{- end }}
      {{- if .Values.clusterAccess.serviceDiscovery }}
      - services
      - endpoints
      {{- end }}
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "doctor-api-mcp.fullname" . }}
  labels:
    {{- include "doctor-api-mcp.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "doctor-api-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "doctor-api-mcp.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- if or (eq $scope "namespace") $configMapState }}
{{- if eq $scope "cluster" }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "doctor-api-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doctor-api-mcp.labels" . | nindent 4 }}
rules:
  {{- if eq $scope "namespace" }}
  - apiGroups: [""]
    resources:
      - pods
      {{- if .Values.observability.enableDeploymentEvents }}
      - events
      {{- end }}
      {{- if .Values.clusterAccess.serviceDiscovery }}
      - services
      - endpoints
      {{- end }}
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  {{- end }}
  {{- if $configMapState }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-state" (include "doctor-api-mcp.fullname" .) | quote }}]
    verbs: ["get", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "doctor-api-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doctor-api-mcp.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "doctor-api-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "doctor-api-mcp.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
