{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "doctor-api-mcp.fullname" . }}-readiness-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doctor-api-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: readiness
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command: ["sh", "-ec"]
      args:
        - >-
          wget -qO- --timeout=10
          http://{{ include "doctor-api-mcp.fullname" . }}:{{ .Values.service.port }}/ready
          | grep -q '"status":"ready"'
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
{{- end }}
