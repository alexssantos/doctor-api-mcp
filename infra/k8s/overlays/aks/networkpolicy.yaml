apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcpserver
  namespace: mcp-apis
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-apis
        # The target Gateway controller namespace must opt in explicitly.
        - namespaceSelector:
            matchLabels:
              ingress.mcp-apis.io/allow: "true"
      ports:
        - protocol: TCP
          port: 4000
