apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mcp-apis
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'precoapi'
        metrics_path: /metrics
        static_configs:
          - targets: ['precoapi:80']
            labels:
              service: precoapi

      - job_name: 'produtoapi'
        metrics_path: /metrics
        static_configs:
          - targets: ['produtoapi:80']
            labels:
              service: produtoapi
