apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-preco-init
  namespace: mcp-apis
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS prices (
        id UUID PRIMARY KEY,
        product_id UUID NOT NULL,
        value NUMERIC(10,2),
        currency TEXT,
        updated_at TIMESTAMP
    );
    CREATE UNIQUE INDEX IF NOT EXISTS idx_prices_product_id ON prices(product_id);
