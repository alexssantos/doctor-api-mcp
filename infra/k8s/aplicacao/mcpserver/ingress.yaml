apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcpserver-ingress
  namespace: mcp-apis
  annotations:
    # Streamable HTTP sessions are process-local. Cookie affinity keeps one
    # client on the same replica while still allowing a zero-downtime rollout.
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  ingressClassName: traefik
  rules:
    - host: mcpserver.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcpserver
                port:
                  number: 4000
