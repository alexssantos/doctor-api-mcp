apiVersion: v1
kind: ConfigMap
metadata:
  name: mcpserver-config
  namespace: mcp-apis
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  # Local k3d profile only. The AKS overlay must enable authentication and
  # source reader/admin keys from a managed Secret before it is rendered.
  Security__Authentication__Enabled: "false"
  Security__AllowedNamespaces__0: "mcp-apis"
  Security__AllowedServiceHostSuffixes__0: ".svc.cluster.local"
  Security__AllowedServicePorts__0: "80"
  Security__AllowedServicePorts__1: "443"
  Security__AllowedServicePorts__2: "8080"
  Otel__Endpoint: "http://jaeger.mcp-apis.svc.cluster.local:4317"
  Otel__CaptureBody: "false"
  # Data sources
  # Use FQDNs (http://<service>.<namespace>.svc.cluster.local) to support
  # services in any namespace — not just the one the MCP Server lives in.
  DataSources__Jaeger__BaseUrl: "http://jaeger.mcp-apis.svc.cluster.local:16686"
  DataSources__Prometheus__BaseUrl: "http://prometheus.mcp-apis.svc.cluster.local:9090"
  DataSources__Loki__BaseUrl: "http://loki.mcp-apis.svc.cluster.local:3100"
  DataSources__Kubernetes__Namespace: "mcp-apis"
  # OpenAPI spec paths probed in order — first 200 response wins
  DataSources__OpenApiSpecPaths__0: "/openapi/v1.json"
  DataSources__OpenApiSpecPaths__1: "/openapi/v2.json"
  DataSources__OpenApiSpecPaths__2: "/swagger/v1/swagger.json"
  DataSources__OpenApiSpecPaths__3: "/api/v1/openapi.json"
  DataSources__OpenApiSpecPaths__4: "/api-docs/v1.json"
  # Indexed services — use FQDNs to reach services across namespaces:
  #   http://<service>.<namespace>.svc.cluster.local
  # Short names (http://<service>) only resolve within the same namespace.
  # In Auto mode these entries reinforce auto-discovered apps and make them
  # enabled by default (auto-discovered apps start disabled, opt-in).
  Services__precoapi: "http://precoapi.mcp-apis.svc.cluster.local"
  Services__produtoapi: "http://produtoapi.mcp-apis.svc.cluster.local"
  # Discovery:Mode options: Auto | Config | Kubernetes | Both
  #   Auto scans the whole cluster: Deployments + Services/Endpoints + Jaeger
  #   trace emitters, correlated into one application catalog.
  Discovery__Mode: "Auto"
  Discovery__KubernetesLabel: "mcp-apis/indexed"
  # Periodic re-scan interval in seconds (0 = startup + manual rescan only)
  Discovery__RescanSeconds: "60"
  # Successful OpenAPI validations are reused for this long; failures retry every scan
  Discovery__RevalidateSeconds: "300"
  # Apps not seen by any scan for this long are dropped from the catalog
  Discovery__ForgetAfterMinutes: "60"
  # ConfigMap that persists the per-application indexing toggle
  Discovery__StateConfigMap: "mcpserver-state"
  # vNext production-safe surface. Raw PromQL/LogQL remains unavailable.
  Observability__Features__EnableRawQueries: "false"
  Observability__Features__EnableLogs: "true"
  Observability__Features__EnableDeploymentEvents: "true"
  # Namespaces never scanned
  Discovery__ExcludeNamespaces__0: "kube-system"
  Discovery__ExcludeNamespaces__1: "kube-public"
  Discovery__ExcludeNamespaces__2: "kube-node-lease"
  # Infrastructure kept out of the application catalog (get_health still works
  # for these names via the tool guard's fail-open behavior)
  Discovery__ExcludeApps__0: "mcpserver"
  Discovery__ExcludeApps__1: "jaeger"
  Discovery__ExcludeApps__2: "prometheus"
  Discovery__ExcludeApps__3: "grafana"
  Discovery__ExcludeApps__4: "loki"
  Discovery__ExcludeApps__5: "promtail"
  Discovery__ExcludeApps__6: "postgres-preco"
  Discovery__ExcludeApps__7: "postgres-produto"
  Discovery__ExcludeApps__8: "kubernetes"
  # OTel service names ignored by discovery
  Discovery__ExcludeOtelServices__0: "jaeger-query"
  Discovery__ExcludeOtelServices__1: "McpServer"
  # Dashboard quick-links -- browser-facing URLs (via k3d Traefik on host port 8080)
  Dashboard__Links__Jaeger: "http://jaeger.local:8080"
  Dashboard__Links__Prometheus: "http://prometheus.local:8080"
  Dashboard__Links__Grafana: "http://grafana.local:8080"
