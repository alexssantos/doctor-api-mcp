apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: produtoapi-ingress
  namespace: mcp-apis
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: produtoapi.local
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: produtoapi
                port:
                  number: 80
