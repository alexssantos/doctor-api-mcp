replicaCount: 2

image:
  repository: produtoapi
  tag: latest
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: produtoapi.local
  annotations: {}

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

db:
  host: postgres-produto
  port: 5432
  name: produto_db
  user: postgres
  # Override via --set db.password=<value> or a values-override file
  password: postgres

precoapi:
  baseUrl: http://precoapi

otel:
  endpoint: http://jaeger:4317
  captureBody: "false"

probes:
  readiness:
    path: /scalar/v1
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /scalar/v1
    initialDelaySeconds: 30
    periodSeconds: 15
