apiVersion: v1
kind: Service
metadata:
  name: {{ include "produtoapi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "produtoapi.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "produtoapi.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
