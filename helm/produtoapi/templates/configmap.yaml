apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "produtoapi.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "produtoapi.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Otel__Endpoint: {{ .Values.otel.endpoint | quote }}
  Otel__CaptureBody: {{ .Values.otel.captureBody | quote }}
  PrecoApi__BaseUrl: {{ .Values.precoapi.baseUrl | quote }}
