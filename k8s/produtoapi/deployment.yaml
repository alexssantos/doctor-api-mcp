apiVersion: apps/v1
kind: Deployment
metadata:
  name: produtoapi
  namespace: mcp-apis
  labels:
    app: produtoapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: produtoapi
  template:
    metadata:
      labels:
        app: produtoapi
    spec:
      containers:
        - name: produtoapi
          image: produtoapi:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: produtoapi-config
            - secretRef:
                name: produtoapi-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /scalar/v1
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /scalar/v1
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
